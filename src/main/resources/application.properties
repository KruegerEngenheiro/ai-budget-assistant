spring.application.name=ai-budget-assistant

# In-memory database (H2) for development and study. Postgres-ready for later.
spring.datasource.url=jdbc:h2:mem:budget
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# OpenAI (read from the OPENAI_API_KEY environment variable, never hard-coded)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0
